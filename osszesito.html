<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Védett anyag</title>
<style>
/* Zárkép: középre igazított kártya jelszómezővel; a lap tartalma titkosítva, csak a helyes jelszóval fejthető vissza */
:root { --bg: #f4f6f1; --surface: #fcfcfb; --fg: #1b211a; --muted: #5a6356; --line: #dde2d6; --accent: #3b6a33; --hiba: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121612; --surface: #1a1f19; --fg: #e8ece4; --muted: #a3ab9d; --line: #2f362d; --accent: #93c283; --hiba: #f2a39d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121612; --surface: #1a1f19; --fg: #e8ece4; --muted: #a3ab9d; --line: #2f362d; --accent: #93c283; --hiba: #f2a39d; color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 16px; box-sizing: border-box; }
.kartya { box-sizing: border-box; width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
h1 { margin: 0; font-family: Georgia, serif; font-size: 1.45rem; line-height: 1.2; }
p { margin: 0; color: var(--muted); }
label { font-weight: 600; font-size: .92rem; }
input { font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
button[disabled], input[disabled] { opacity: .55; cursor: not-allowed; }
.uzenet { min-height: 1.4em; font-size: .92rem; }
.uzenet.hiba { color: var(--hiba); font-weight: 600; }
.lakat { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--line); font-size: 1.4rem; }
</style>
</head>

<form class="kartya" id="urlap" autocomplete="off" style="visibility:hidden">

  <button id="gomb" type="submit">Megnyitás</button>
  <div class="uzenet" id="uzenet" aria-live="polite"></div>
</form>

const MAX = 3, K_PROBA = 'vedelem-probak', K_KULCS = 'vedelem-kulcs';

let kulcs = null;
async function szarmaztat(jelszo) {

function megnyit(html) { const ir = () => { document.open(); document.write(html); document.close(); }; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(ir, 0), { once: true }); else setTimeout(ir, 0); }
const uzenet = document.getElementById('uzenet'), mezo = document.getElementById('jelszo'), gomb = document.getElementById('gomb');
function zarolva() {
  mezo.disabled = true; gomb.disabled = true;
  uzenet.className = 'uzenet hiba';
  uzenet.textContent = 'Háromszor hibás jelszót adtál meg, a megnyitás ebben a böngészőben zárolva. Kérj segítséget Balázstól.';

async function indul() {

  const tarolt = ss && tarol.get(ss, K_KULCS);
