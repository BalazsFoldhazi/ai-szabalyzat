<!doctype html>
<html lang="hu">
<head>

<title>Védett anyag</title>
<style>
/* Zárkép: középre igazított kártya jelszómezővel; a lap tartalma titkosítva, csak a helyes jelszóval fejthető vissza */
:root { --bg: #f4f6f1; --surface: #fcfcfb; --fg: #1b211a; --muted: #5a6356; --line: #dde2d6; --accent: #3b6a33; --hiba: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121612; --surface: #1a1f19; --fg: #e8ece4; --muted: #a3ab9d; --line: #2f362d; --accent: #93c283; --hiba: #f2a39d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121612; --surface: #1a1f19; --fg: #e8ece4; --muted: #a3ab9d; --line: #2f362d; --accent: #93c283; --hiba: #f2a39d; color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; padding: 16px; box-sizing: border-box; }
.kartya { box-sizing: border-box; width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
h1 { margin: 0; font-family: Georgia, serif; font-size: 1.45rem; line-height: 1.2; }
p { margin: 0; color: var(--muted); }
label { font-weight: 600; font-size: .92rem; }
input { font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
button[disabled], input[disabled] { opacity: .55; cursor: not-allowed; }
.uzenet { min-height: 1.4em; font-size: .92rem; }
.uzenet.hiba { color: var(--hiba); font-weight: 600; }
.lakat { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--line); font-size: 1.4rem; }
</style>
</head>
<body>
<form class="kartya" id="urlap" autocomplete="off" style="visibility:hidden">
  <div class="lakat" aria-hidden="true">🔒</div>
  <h1>Védett anyag</h1>
  <p>Az AI-szabályzat anyagai jelszóval nyithatók meg. Háromszor lehet próbálkozni.</p>
  <label for="jelszo">Jelszó</label>
  <input id="jelszo" type="password" autocomplete="current-password" required>
  <button id="gomb" type="submit">Megnyitás</button>
  <div class="uzenet" id="uzenet" aria-live="polite"></div>
</form>

const MAX = 3, K_PROBA = 'vedelem-probak', K_KULCS = 'vedelem-kulcs';
const tarol = { get: (t, k) => { try { return t.getItem(k); } catch (e) { return null; } }, set: (t, k, v) => { try { t.setItem(k, v); } catch (e) {} }, del: (t, k) => { try { t.removeItem(k); } catch (e) {} } };
const ls = (() => { try { return window.localStorage; } catch (e) { return null; } })(), ss = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
let memProba = 0;
const probak = () => ls ? +(tarol.get(ls, K_PROBA) || 0) : memProba;
const setProbak = n => { if (ls) tarol.set(ls, K_PROBA, String(n)); else memProba = n; };
const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u2b = u => btoa(String.fromCharCode(...new Uint8Array(u)));
let kulcs = null;
async function szarmaztat(jelszo) {
  const alap = await crypto.subtle.importKey('raw', new TextEncoder().encode(jelszo), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b2u(ADAT.so), iterations: ADAT.korok, hash: 'SHA-256' }, alap, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function visszafejt(titkos, k) {
  const [iv, adat] = titkos.split('.');
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(iv) }, k || kulcs, b2u(adat)));
}
window.__visszafejt = t => visszafejt(t);
window.__visszafejtBajt = async t => { const [iv, adat] = t.split('.'); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(iv) }, kulcs, b2u(adat)); };
// csak a zárkép teljes betöltése után írjuk felül a dokumentumot, különben a böngésző hozzáfűzi a tartalmat
function megnyit(html) { const ir = () => { document.open(); document.write(html); document.close(); }; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(ir, 0), { once: true }); else setTimeout(ir, 0); }
const uzenet = document.getElementById('uzenet'), mezo = document.getElementById('jelszo'), gomb = document.getElementById('gomb');
function zarolva() {
  mezo.disabled = true; gomb.disabled = true;
  uzenet.className = 'uzenet hiba';
  uzenet.textContent = 'Háromszor hibás jelszót adtál meg, a megnyitás ebben a böngészőben zárolva. Kérj segítséget Balázstól.';
}
// a zárkép csak akkor látszik, ha tényleg jelszó kell; ha a lapfülben már megadták, a háttér üres marad a tartalom megjelenéséig
const mutat = () => { document.getElementById('urlap').style.visibility = ''; };
async function indul() {
  // ha ebben a lapfülben már megadták a jelszót, a kulcs a munkamenetben van
  const tarolt = ss && tarol.get(ss, K_KULCS);
  if (tarolt) {
    try { kulcs = await crypto.subtle.importKey('raw', b2u(tarolt), 'AES-GCM', true, ['decrypt']); megnyit(await visszafejt(ADAT.lap)); return; }
    catch (e) { kulcs = null; tarol.del(ss, K_KULCS); }
  }
  mutat();
  if (probak() >= MAX) { zarolva(); return; }
  uzenet.textContent = `Hátralévő próbálkozás: ${MAX - probak()}`;
  mezo.focus();
}
document.getElementById('urlap').addEventListener('submit', async e => {
  e.preventDefault();
  if (probak() >= MAX || !mezo.value) return;
  gomb.disabled = true; uzenet.className = 'uzenet'; uzenet.textContent = 'Ellenőrzés…';
  try {
    const k = await szarmaztat(mezo.value);
    const html = await visszafejt(ADAT.lap, k);
    kulcs = k; setProbak(0);
    if (ss) tarol.set(ss, K_KULCS, u2b(await crypto.subtle.exportKey('raw', k)));
    megnyit(html);
  } catch (err) {
    const n = probak() + 1; setProbak(n); mezo.value = '';
    if (n >= MAX) { zarolva(); return; }
    uzenet.className = 'uzenet hiba';
    uzenet.textContent = `Hibás jelszó. Hátralévő próbálkozás: ${MAX - n}`;
    gomb.disabled = false; mezo.focus();
  }
});
indul();
})();
</script>
